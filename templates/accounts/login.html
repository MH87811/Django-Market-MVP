<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ورود | بازارچه</title>
  <meta name="description" content="بازارچه، نمونهٔ اولیهٔ بازار آنلاین">
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body class="">

<div class="auth-page"><header class="auth-top"><a class="navbar-logo" href="../core/index.html"><img src="assets/icons/logo.svg" alt="" width="38" height="38"><span>بازارچه</span></a></header>
<main id="main" class="auth-main"><div class="auth-card">
  <h1>ورود به حساب</h1><p>برای ادامه، وارد حساب کاربری خود شوید.</p>
  <form action="../panel/dashboard.html" method="get" data-validate novalidate>
    <div class="form-group"><label class="form-label" for="identity">نام کاربری یا ایمیل</label><div class="input-group"><span class="input-group-icon"><i data-lucide="user-round"></i></span><input class="input input-ltr" id="identity" name="identity" autocomplete="username" required></div><span class="form-error">نام کاربری یا ایمیل را وارد کنید.</span></div>
    <div class="form-group"><label class="form-label" for="password">گذرواژه</label><div class="input-group has-action"><span class="input-group-icon"><i data-lucide="lock"></i></span><input class="input input-ltr" id="password" name="password" type="password" autocomplete="current-password" required><button type="button" class="input-group-action" data-toggle-password="password" aria-label="نمایش گذرواژه"><i data-lucide="eye"></i></button></div><span class="form-error">گذرواژه را وارد کنید.</span></div>
    <div class="row-between" style="margin-block-start:var(--space-3)"><label class="check"><input type="checkbox" name="remember"> مرا به خاطر بسپار</label><a class="text-sm link-inline" href="../order/states.html">فراموشی گذرواژه</a></div>
    <button type="submit" class="btn btn-primary btn-lg btn-block">ورود</button>
  </form>
  <p class="auth-foot">حساب ندارید؟ <a href="register.html">ثبت‌نام کنید</a></p>
</div></main></div>

<script src="https://unpkg.com/lucide@0.453.0/dist/umd/lucide.min.js"></script>
<script src="js/app.js"></script>
</body>
</html>
