<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ثبت‌نام | بازارچه</title>
  <meta name="description" content="بازارچه، نمونهٔ اولیهٔ بازار آنلاین">
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body class="">

<div class="auth-page"><header class="auth-top"><a class="navbar-logo" href="../core/index.html"><img src="assets/icons/logo.svg" alt="" width="38" height="38"><span>بازارچه</span></a></header>
<main id="main" class="auth-main"><div class="auth-card">
  <h1>ساخت حساب جدید</h1><p>در چند ثانیه عضو بازارچه شوید.</p>
  <form action="../panel/dashboard.html" method="get" data-validate novalidate>
    <fieldset class="role-picker" style="margin-block-end:var(--space-4)"><legend class="form-label" style="margin-block-end:8px;padding:0">نوع حساب</legend>
      <label class="role-option"><input type="radio" name="is_vendor" value="false" checked><span><strong>خریدار</strong><small>خرید از فروشگاه‌ها</small></span></label>
      <label class="role-option"><input type="radio" name="is_vendor" value="true"><span><strong>فروشنده</strong><small>باز کردن فروشگاه</small></span></label>
    </fieldset>
    <div class="form-group"><label class="form-label" for="username">نام کاربری</label><input class="input input-ltr" id="username" name="username" autocomplete="username" required minlength="3"><span class="form-error">حداقل ۳ نویسه وارد کنید.</span></div>
    <div class="form-group"><label class="form-label" for="email">ایمیل</label><input class="input input-ltr" id="email" name="email" type="email" autocomplete="email" required><span class="form-error">یک ایمیل معتبر وارد کنید.</span></div>
    <div class="form-group"><label class="form-label" for="reg-phone">شمارهٔ موبایل</label><input class="input input-ltr input-num" id="reg-phone" name="phone" type="tel" inputmode="tel" placeholder="09123456789" required pattern="09[0-9]{9}"><span class="form-error">شماره را به‌صورت ۰۹۱۲۳۴۵۶۷۸۹ وارد کنید.</span></div>
    <div class="form-group"><label class="form-label" for="pass1">گذرواژه</label><div class="input-group has-action"><span class="input-group-icon"><i data-lucide="lock"></i></span><input class="input input-ltr" id="pass1" name="password" type="password" autocomplete="new-password" required minlength="8"><button type="button" class="input-group-action" data-toggle-password="pass1" aria-label="نمایش گذرواژه"><i data-lucide="eye"></i></button></div><span class="form-hint">حداقل ۸ نویسه</span><span class="form-error">گذرواژه باید حداقل ۸ نویسه باشد.</span></div>
    <div class="form-group"><label class="form-label" for="pass2">تکرار گذرواژه</label><input class="input input-ltr" id="pass2" name="password_confirm" type="password" autocomplete="new-password" required data-match="pass1"><span class="form-error">گذرواژه‌ها یکسان نیستند.</span></div>
    <button type="submit" class="btn btn-primary btn-lg btn-block">ثبت‌نام</button>
    <p class="divider-text">ورود با حساب‌های دیگر</p>
    <button type="button" class="btn btn-secondary btn-block btn-future" disabled><i data-lucide="globe"></i> ورود با گوگل (به‌زودی)</button>
  </form>
  <p class="auth-foot">قبلاً ثبت‌نام کرده‌اید؟ <a href="login.html">وارد شوید</a></p>
</div></main></div>

<script src="https://unpkg.com/lucide@0.453.0/dist/umd/lucide.min.js"></script>
<script src="js/app.js"></script>
</body>
</html>
